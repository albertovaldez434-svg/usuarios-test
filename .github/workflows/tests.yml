name: Angular Tests

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development
      - main

jobs:
  ai-test-analysis: 

    name: AI Test Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          echo "=== Changed files ==="

          git diff --name-status \
            origin/main...origin/development

      - name: Get code diff
        run: |
          echo "=== Code diff ==="

          git diff \
            --unified=20 \
            origin/main...origin/development
        
      - name: Find related tests
        run: |
          echo "=== Related test files ==="

          git diff --name-only \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }} \
            | grep -E '\.(ts|html|scss)$' \
            | while read file; do

                base="${file%.*}"

                spec="${base}.spec.ts"

                if [ -f "$spec" ]; then
                  echo "$spec"
                fi

              done
            
  run-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build application
        run: npm run build

