<div class="ion-activatable ripple-parent">
  <ion-button [type]="type" [class.btn-primary]="type === 'primary' || type === 'submit'" [class.btn-secondary]="type === 'secondary'" [expand]="expand" 
    [class]="class" [size]="size" (click)="onClick()" [disabled]="disabled">
    @if (iconName) {
    <ion-icon [slot]="slot" [name]="iconName"></ion-icon>
    }
    {{text}}
  </ion-button>
</div>
